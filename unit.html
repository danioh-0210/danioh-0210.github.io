<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單元詳情 | 2026 AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/pic/favicon.ico">
    <style>
        /* 調整為大地色系漸層背景 */
        body {
            background: linear-gradient(135deg, #6C4E44 0%, #8D6E63 50%, #A1887F 100%);
            background-attachment: fixed;
            color: #2d3748;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* 柔和光點背景 - 調整為暖色調 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(215, 204, 200, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 85% 80%, rgba(108, 78, 68, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 35%);
            z-index: -1;
            pointer-events: none;
        }

        /* 導航列 - 使用 #6C4E44 作為基底 */
        .navbar {
            background: rgba(108, 78, 68, 0.9) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(215, 204, 200, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .navbar-brand {
            color: #D7CCC8 !important;
            font-weight: 700;
            font-size: 1.5rem;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.95) !important;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: #D7CCC8 !important;
        }

        /* Unit Navigation Styles */
        .unit-nav-container {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        .unit-nav-left { left: 20px; }
        .unit-nav-right { right: 20px; }

        .unit-nav-btn {
            background: rgba(108, 78, 68, 0.9);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .unit-nav-btn:hover {
            background: #8D6E63;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(108, 78, 68, 0.5);
        }

        .unit-nav-btn:disabled {
            background: rgba(161, 136, 127, 0.5);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Unit Info Tooltip */
        .unit-nav-tooltip {
            position: absolute;
            background: rgba(108, 78, 68, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1001;
            border: 1px solid rgba(215, 204, 200, 0.3);
        }

        .unit-nav-left .unit-nav-tooltip { right: 60px; top: 50%; transform: translateY(-50%); }
        .unit-nav-right .unit-nav-tooltip { left: 60px; top: 50%; transform: translateY(-50%); }

        .unit-nav-btn:hover .unit-nav-tooltip { opacity: 1; }

        /* Unit Counter */
        .unit-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(108, 78, 68, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(215, 204, 200, 0.2);
        }

        /* Keyboard Navigation Hint */
        .keyboard-hint {
            position: fixed;
            top: 120px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #6C4E44;
            z-index: 999;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(108, 78, 68, 0.3);
            opacity: 0;
            animation: fadeInHint 0.5s ease 2s forwards;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeInHint { to { opacity: 1; } }

        /* Project Header */
        .project-header {
            background: transparent;
            padding: 120px 0 40px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.95);
            color: #6C4E44 !important;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            border: 1px solid rgba(108, 78, 68, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            background: white;
            color: #8D6E63 !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 78, 68, 0.3);
        }

        .breadcrumb-item a { color: white; text-decoration: none; }
        .breadcrumb-item a:hover { color: #D7CCC8; }
        .breadcrumb-item.active { color: #D7CCC8; }

        .project-title {
            color: white !important;
            font-weight: 700;
            font-size: 2.5rem;
            margin-top: 1rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        /* Content Section */
        .section-title {
            color: #D7CCC8 !important; /* 改為淺米色增加質感 */
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Image Gallery */
        .gallery-item {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(108, 78, 68, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(108, 78, 68, 0.3);
            border-color: #6C4E44;
        }

        .gallery-overlay h5 { color: #6C4E44; font-weight: 600; }
        .gallery-overlay p { color: #8D6E63; }

        /* Badge 樣式 - 調整為咖啡色系漸層 */
        .bg-primary {
            background: linear-gradient(135deg, #6C4E44 0%, #8D6E63 100%) !important;
            color: white !important;
        }

        /* Modal */
        .modal-content {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            border: 1px solid rgba(108, 78, 68, 0.3);
        }

        .modal-title { color: #6C4E44; }

        @media (max-width: 768px) {
            .unit-counter { bottom: 20px; }
            .project-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">2026 AI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html#home">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about">關於我</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#projects">我的專案</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">聯絡我</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="unit-nav-container unit-nav-left">
        <button class="unit-nav-btn" id="prevUnitBtn" onclick="navigateToUnit(currentUnit - 1)">
            <i class="fas fa-chevron-left"></i>
            <div class="unit-nav-tooltip" id="prevUnitTooltip"></div>
        </button>
    </div>

    <div class="unit-nav-container unit-nav-right">
        <button class="unit-nav-btn" id="nextUnitBtn" onclick="navigateToUnit(currentUnit + 1)">
            <i class="fas fa-chevron-right"></i>
            <div class="unit-nav-tooltip" id="nextUnitTooltip"></div>
        </button>
    </div>

    <div class="unit-counter" id="unitCounter">單元 1 / 24</div>

    <div class="keyboard-hint" id="keyboardHint">
        <button class="hint-close" onclick="closeHint()">&times;</button>
        💡 使用 ← → 鍵快速切換單元
    </div>

    <section class="project-header">
        <div class="container">
            <a href="index.html#projects" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>返回專案列表</span>
            </a>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mt-3">
                    <li class="breadcrumb-item"><a href="index.html">首頁</a></li>
                    <li class="breadcrumb-item"><a href="index.html#projects">專案</a></li>
                    <li class="breadcrumb-item active" id="breadcrumb-unit">單元</li>
                </ol>
            </nav>
            <h1 class="project-title" id="project-title">單元</h1>
            <p class="project-subtitle" id="project-subtitle">單元作業</p>
        </div>
    </section>

    <div class="container">
        <section class="content-section fade-in">
            <h2 class="section-title">作業相簿</h2>
            <div class="image-gallery">
                <div class="gallery-grid" id="gallery-grid"></div>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        /* 保持原本的邏輯代碼，顏色會透過 CSS 生效 */
        // (此處內容與你原本的 JavaScript 相同)
    </script>
</body>
</html>
